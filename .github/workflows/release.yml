name: Release & Packaging

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-release:
    name: Build & Package (x86_64 Linux)
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies (Qt 6 & Clang)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            clang \
            cmake \
            libclang-dev \
            zstd \
            qt6-base-dev \
            qt6-declarative-dev \
            qt6-svg-dev \
            qt6-wayland-dev \
            appstream \
            desktop-file-utils \
            libfuse2t64 \
            file \
            rpm

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2

      - name: Validate AppStream Metainfo
        run: |
          appstreamcli validate --no-net data/io.github.criperto.notes.metainfo.xml

      - name: Run automated test suite
        run: |
          node tests/run.js

      - name: Compile release binary
        run: |
          cargo build --release --locked

      - name: Prepare standalone tarball release
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          DIST_DIR="dist/criperto-notes-${VERSION}"
          mkdir -p "${DIST_DIR}"

          PREFIX="/usr" DESTDIR="${DIST_DIR}" bash scripts/install-system.sh
          cp README.md LICENSE "${DIST_DIR}/"

          tar -czf "dist/criperto-notes-${VERSION}-x86_64-linux.tar.gz" -C dist "criperto-notes-${VERSION}"
          cd dist && sha256sum "criperto-notes-${VERSION}-x86_64-linux.tar.gz" > "criperto-notes-${VERSION}-x86_64-linux.tar.gz.sha256"

      - name: Build AppImage
        run: |
          bash packaging/appimage/build-appimage.sh
          if ls packaging/appimage/out/*.AppImage 1> /dev/null 2>&1; then
            cp packaging/appimage/out/*.AppImage dist/
            cd dist && for f in *.AppImage; do sha256sum "$f" > "${f}.sha256"; done
          fi

      - name: Build Debian Package (.deb)
        run: |
          bash packaging/deb/build-deb.sh

      - name: Build Fedora Package (.rpm)
        run: |
          bash packaging/rpm/build-rpm.sh

      - name: Build Arch Linux Package (.pkg.tar.zst)
        run: |
          sudo apt-get install -y zstd
          bash packaging/arch/build-arch.sh

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
            dist/*.AppImage
            dist/*.AppImage.sha256
            dist/*.deb
            dist/*.deb.sha256
            dist/*.rpm
            dist/*.rpm.sha256
            dist/*.pkg.tar.zst
            dist/*.pkg.tar.zst.sha256
          generate_release_notes: true
          draft: false
          prerelease: false
          make_latest: "true"
