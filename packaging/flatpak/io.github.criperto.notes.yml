id: io.github.criperto.notes
runtime: org.kde.Platform
runtime-version: '6.8'
sdk: org.kde.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: criperto-notes

finish-args:
  # Soporte de display Wayland y fallback X11
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --device=dri

  # Acceso de red para el Web Clipper y descarga de diccionarios
  - --share=network

  # Acceso al sistema de archivos para notas y exportaciones
  - --filesystem=xdg-documents
  - --filesystem=xdg-download

  # Integración en solo lectura con temas del entorno Quickshell y Pywal
  - --filesystem=xdg-config/quickshell:ro
  - --filesystem=xdg-cache/wal:ro

build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
  env:
    CARGO_HOME: /run/build/criperto-notes/cargo

modules:
  - name: criperto-notes
    buildsystem: simple
    build-commands:
      # Nota para Flathub: generar cargo-sources.json con `flatpak-cargo-generator Cargo.lock`
      # y añadir `--offline` al build en el PR oficial de Flathub (sin acceso a red en compilación).
      - cargo build --release --locked
      - PREFIX=/app bash scripts/install-system.sh
    sources:
      - type: dir
        path: ../..
